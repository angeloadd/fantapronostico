name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            docker compose -f docker-compose.production.yaml build
            docker compose -f docker-compose.production.yaml up -d --remove-orphans
            docker compose -f docker-compose.production.yaml exec -T app php artisan migrate --force
            docker compose -f docker-compose.production.yaml exec -T app php artisan optimize